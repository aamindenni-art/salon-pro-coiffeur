<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9c7619">
<title>Réserver — Salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* ===== Réservation en ligne — identité "noir & or" ===== */
:root{
  --bg:#f4f1ea; --surface:#fff; --surface-2:#faf8f2; --surface-3:#f1ede3;
  --fg:#19170f; --muted:#6a655a; --faint:#9a9485; --border:#e9e3d6; --border-strong:#dad3c3;
  --accent:#9c7619; --accent-ink:#7a5c10; --accent-soft:rgba(156,118,25,.13); --on-accent:#fff;
  --logo:linear-gradient(145deg,#c9a24c,#8c6a18);
  --good:#2f7d4f; --sh:0 2px 10px rgba(30,25,15,.08); --sh-lg:0 12px 40px rgba(25,20,10,.18);
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121110; --surface:#1b1a16; --surface-2:#211f1a; --surface-3:#2a2721;
  --fg:#f2ece0; --muted:#a8a294; --faint:#7a746a; --border:#322f28; --border-strong:#443f35;
  --accent:#d9b45f; --accent-ink:#ecc87e; --accent-soft:rgba(217,180,95,.15); --on-accent:#1a1810;
  --sh:0 2px 10px rgba(0,0,0,.45); --sh-lg:0 14px 44px rgba(0,0,0,.6); color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:
  radial-gradient(1100px 500px at 100% -10%,var(--accent-soft),transparent),var(--bg);
  color:var(--fg);font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15.5px;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}
.head{text-align:center;padding:22px 0 10px}
.logo{width:66px;height:66px;border-radius:18px;display:grid;place-items:center;margin:0 auto 14px;
  background:var(--logo);color:#fff;font-family:"Oswald";font-weight:700;font-size:32px;box-shadow:var(--sh-lg)}
.head h1{font-family:"Oswald";font-size:27px;margin:0;letter-spacing:.3px}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.steps{display:flex;gap:6px;justify-content:center;margin:16px 0 18px}
.steps i{height:6px;width:26px;border-radius:999px;background:var(--border-strong)}
.steps i.on{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:700;margin:2px 0 10px}
h2{font-family:"Oswald";font-size:19px;margin:0 0 12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--border);
  background:var(--surface-2);border-radius:13px;padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:transform .07s,border-color .15s}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .n{font-weight:600;flex:1;min-width:0}
.opt .n small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.opt .p{font-family:"Oswald";color:var(--accent-ink);font-weight:600;font-size:16px}
.opt .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);flex:none;display:grid;place-items:center}
.opt.sel .tick{border-color:var(--accent);background:var(--accent)}
.opt.sel .tick::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(0,-1px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:62px;text-align:center;border:1px solid var(--border-strong);background:var(--surface-2);
  border-radius:13px;padding:9px 12px;cursor:pointer}
.chip.sel{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.chip .d{font-size:11px;color:var(--muted);text-transform:uppercase}
.chip.sel .d{color:var(--on-accent);opacity:.85}
.chip .n{font-family:"Oswald";font-size:18px;font-weight:600}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.slot{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:11px;padding:11px 0;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.slot.sel{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.slot.off{opacity:.35;pointer-events:none}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:13px;border:1px solid var(--border-strong);border-radius:12px;background:var(--surface-2);color:var(--fg);font-size:16px}
.field input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);background:var(--surface)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px;border:none;border-radius:14px;
  font-family:"DM Sans";font-size:16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on-accent);box-shadow:var(--sh-lg)}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.5}
.btn.wa{background:#25d366;color:#fff}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:1px solid var(--border)}
.btn svg{width:20px;height:20px}
.summary{display:flex;flex-direction:column;gap:7px;margin-bottom:4px}
.sr{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.sr span:first-child{color:var(--muted)}
.sr b{text-align:right}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:12px}
.foot{text-align:center;color:var(--faint);font-size:12px;margin-top:18px}
.hidden{display:none!important}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo" id="logo">S</div>
    <h1 id="salonName">Salon</h1>
    <p id="salonAddr">Réservez votre rendez-vous en ligne</p>
  </div>
  <div class="steps"><i class="on" data-step="1"></i><i data-step="2"></i><i data-step="3"></i></div>

  <div id="cfgWarn" class="banner hidden">⚠️ Démo : le numéro WhatsApp du salon n'est pas encore configuré.</div>

  <!-- Étape 1 : prestation -->
  <section id="s1" class="card">
    <h2>1. Quelle prestation ?</h2>
    <div id="svcList"></div>
  </section>

  <!-- Étape 2 : date & heure -->
  <section id="s2" class="card hidden">
    <h2>2. Quel jour ?</h2>
    <div class="chips" id="dayChips"></div>
    <div class="lbl" style="margin:16px 0 8px">Heure</div>
    <div class="slots" id="slotGrid"></div>
  </section>

  <!-- Étape 3 : coordonnées -->
  <section id="s3" class="card hidden">
    <h2>3. Vos coordonnées</h2>
    <div class="field"><label>Votre nom *</label><input id="cName" placeholder="Ex : Karim" autocomplete="name"></div>
    <div class="field"><label>Votre téléphone *</label><input id="cPhone" type="tel" placeholder="0661 ..." autocomplete="tel"></div>
    <div class="summary" id="summary"></div>
  </section>

  <button id="cta" class="btn" disabled>Choisir une prestation</button>
  <div class="note" id="ctaNote">Votre demande sera confirmée par le salon.</div>

  <div class="foot">Propulsé par Salon Pro</div>
</div>

<script>
/* ============================================================
   CONFIGURATION DU SALON  (modifiable facilement)
   ============================================================ */
const SALON = {
  name: "Salon",                 // nom affiché
  address: "Réservez votre rendez-vous en ligne",
  whatsapp: "",                  // <-- NUMÉRO WHATSAPP (ex "213661234567", sans + ni espaces). Vide = démo.
  slotMinutes: 30,               // intervalle entre créneaux
  leadHours: 2,                  // délai minimum avant un RDV (heures)
  horizonDays: 21,               // réservable jusqu'à N jours
  // horaires : 0=dimanche … 6=samedi  (on=ouvert)
  hours: {
    0:{on:false, open:"09:00", close:"18:00"},
    1:{on:true,  open:"09:00", close:"18:00"},
    2:{on:true,  open:"09:00", close:"18:00"},
    3:{on:true,  open:"09:00", close:"18:00"},
    4:{on:true,  open:"09:00", close:"18:00"},
    5:{on:true,  open:"09:00", close:"18:00"},
    6:{on:true,  open:"09:00", close:"13:00"}
  },
  closedDates: [],               // ex : ["2026-11-01"]
  services: [
    { name:"Coupe homme",         price:800,  duration:30 },
    { name:"Coupe + barbe",       price:1200, duration:45 },
    { name:"Dégradé",             price:1000, duration:40 },
    { name:"Taille de barbe",     price:500,  duration:20 },
    { name:"Rasage traditionnel", price:700,  duration:30 },
    { name:"Coupe enfant",        price:600,  duration:25 }
  ]
};
/* ============================================================ */

const $ = (s)=>document.querySelector(s);
const JOURS=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURSL=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOISL=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const money=(n)=>Math.round(n).toLocaleString("fr-FR")+" DA";
const pad=(n)=>String(n).padStart(2,"0");
const isoD=(d)=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

let sel = { svc:null, date:null, time:null };

// init en-tête
$("#salonName").textContent = SALON.name;
$("#salonAddr").textContent = SALON.address;
$("#logo").textContent = (SALON.name.trim()[0]||"S").toUpperCase();
document.title = "Réserver — " + SALON.name;
if(!SALON.whatsapp) $("#cfgWarn").classList.remove("hidden");

// Étape 1 : prestations
$("#svcList").innerHTML = SALON.services.map((s,i)=>`
  <button class="opt" data-svc="${i}">
    <div class="n">${s.name}<small>${s.duration} min</small></div>
    <div class="p">${money(s.price)}</div><div class="tick"></div></button>`).join("");
document.querySelectorAll("[data-svc]").forEach(b=>b.onclick=()=>{
  sel.svc = SALON.services[+b.dataset.svc];
  document.querySelectorAll("[data-svc]").forEach(x=>x.classList.toggle("sel", x===b));
  showStep(2); buildDays(); update();
});

// Étape 2 : jours disponibles
function buildDays(){
  const chips=[]; const now=new Date(); let added=0;
  for(let i=0;i<=SALON.horizonDays && added<14;i++){
    const d=new Date(now); d.setDate(now.getDate()+i);
    const wd=d.getDay(); const h=SALON.hours[wd];
    if(!h||!h.on) continue;
    if(SALON.closedDates.includes(isoD(d))) continue;
    chips.push(`<button class="chip" data-day="${isoD(d)}"><div class="d">${JOURS[wd]}</div><div class="n">${d.getDate()}</div><div class="d">${MOIS[d.getMonth()]}</div></button>`);
    added++;
  }
  $("#dayChips").innerHTML = chips.join("") || `<div class="note">Aucune disponibilité configurée.</div>`;
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{
    sel.date=b.dataset.day; sel.time=null;
    document.querySelectorAll("[data-day]").forEach(x=>x.classList.toggle("sel",x===b));
    buildSlots(); update();
  });
  $("#slotGrid").innerHTML=`<div class="note" style="grid-column:1/-1">Choisissez d'abord un jour.</div>`;
}
function buildSlots(){
  const d=new Date(sel.date+"T00:00"); const wd=d.getDay(); const h=SALON.hours[wd];
  const [oh,om]=h.open.split(":").map(Number); const [ch,cm]=h.close.split(":").map(Number);
  let t=oh*60+om; const end=ch*60+cm; const dur=sel.svc?sel.svc.duration:SALON.slotMinutes;
  const now=new Date(); const minTs=now.getTime()+SALON.leadHours*3600*1000;
  const out=[];
  for(; t+dur<=end; t+=SALON.slotMinutes){
    const hh=pad(Math.floor(t/60)), mm=pad(t%60); const label=`${hh}:${mm}`;
    const slotDate=new Date(sel.date+"T"+label);
    const off = slotDate.getTime() < minTs;
    out.push(`<button class="slot ${off?"off":""}" data-slot="${label}">${label}</button>`);
  }
  $("#slotGrid").innerHTML = out.join("") || `<div class="note" style="grid-column:1/-1">Pas de créneau ce jour-là.</div>`;
  document.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{
    sel.time=b.dataset.slot;
    document.querySelectorAll("[data-slot]").forEach(x=>x.classList.toggle("sel",x===b));
    showStep(3); drawSummary(); update();
  });
}

function drawSummary(){
  const d=new Date(sel.date+"T00:00");
  $("#summary").innerHTML=`
    <div class="sr"><span>Prestation</span><b>${sel.svc.name} · ${money(sel.svc.price)}</b></div>
    <div class="sr"><span>Date</span><b>${JOURSL[d.getDay()]} ${d.getDate()} ${MOISL[d.getMonth()]}</b></div>
    <div class="sr"><span>Heure</span><b>${sel.time}</b></div>`;
}

function showStep(n){
  $("#s2").classList.toggle("hidden", n<2);
  $("#s3").classList.toggle("hidden", n<3);
  document.querySelectorAll(".steps i").forEach(i=>i.classList.toggle("on", +i.dataset.step<=n));
  if(n>=2) $("#s2").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function update(){
  const cta=$("#cta"); const note=$("#ctaNote");
  if(!sel.svc){ cta.disabled=true; cta.textContent="Choisir une prestation"; return; }
  if(!sel.time){ cta.disabled=true; cta.textContent="Choisir un créneau"; return; }
  const name=$("#cName").value.trim(), phone=$("#cPhone").value.trim();
  cta.disabled = !(name && phone);
  cta.className = "btn wa";
  cta.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.5-1.2A9 9 0 1 0 12 3Zm0 2a7 7 0 1 1-3.6 13l-.4-.2-2.3.6.6-2.2-.2-.4A7 7 0 0 1 12 5Z"/></svg> Envoyer ma demande`;
  note.textContent = SALON.whatsapp ? "Votre demande part sur le WhatsApp du salon ; il confirmera." : "Démo : configurez le numéro WhatsApp pour activer l'envoi.";
}
$("#cName").oninput=update; $("#cPhone").oninput=update;

$("#cta").onclick=()=>{
  const name=$("#cName").value.trim(), phone=$("#cPhone").value.trim();
  if(!sel.svc||!sel.time||!name||!phone) return;
  const d=new Date(sel.date+"T00:00");
  const msg=`Bonjour ${SALON.name}, je souhaite réserver :\n`+
    `• ${sel.svc.name} (${sel.svc.duration} min)\n`+
    `• ${JOURSL[d.getDay()]} ${d.getDate()} ${MOISL[d.getMonth()]} à ${sel.time}\n`+
    `\nNom : ${name}\nTéléphone : ${phone}\n\nMerci de me confirmer. 🙏`;
  if(!SALON.whatsapp){ alert("Démo : le numéro WhatsApp n'est pas configuré."); return; }
  window.location.href = "https://wa.me/"+SALON.whatsapp+"?text="+encodeURIComponent(msg);
};
update();
</script>
</body>
</html>
