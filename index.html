<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b1702a">
<title>Salon Pro</title>
<meta name="description" content="Gestion de clientèle, rendez-vous, caisse et finances pour coiffeur. Hors-ligne, données sur votre téléphone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salon Pro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap">
<script src="vendor/chart.umd.min.js"></script>
<style>
/* Layout: sidebar de navigation + zone de travail ; identité "barbier" brass sur encre chaude */
:root{
  --bg:#f3f2ef; --surface:#ffffff; --surface-2:#faf9f6; --surface-3:#f0eee9;
  --fg:#1b1a18; --muted:#6c6861; --faint:#9a958c;
  --border:#e6e2db; --border-strong:#d8d3ca;
  --accent:#b1702a; --accent-ink:#8a560f; --accent-weak:rgba(177,112,42,.12);
  --good:#2f7d4f; --good-weak:rgba(47,125,79,.13);
  --warn:#b7821a; --warn-weak:rgba(183,130,26,.14);
  --bad:#bd3b2c; --bad-weak:rgba(189,59,44,.12);
  --shadow:0 1px 2px rgba(30,25,15,.05),0 6px 20px rgba(30,25,15,.05);
  --shadow-lg:0 10px 40px rgba(25,20,10,.22);
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131210; --surface:#1d1b18; --surface-2:#242119; --surface-3:#2b271f;
  --fg:#f1ede6; --muted:#a49e93; --faint:#7c766c;
  --border:#322e26; --border-strong:#413c32;
  --accent:#d7985b; --accent-ink:#e9b27d; --accent-weak:rgba(215,152,91,.15);
  --good:#58b981; --good-weak:rgba(88,185,129,.16);
  --warn:#e0ad4e; --warn-weak:rgba(224,173,78,.16);
  --bad:#e07a6b; --bad-weak:rgba(224,122,107,.15);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 14px 46px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131210; --surface:#1d1b18; --surface-2:#242119; --surface-3:#2b271f;
  --fg:#f1ede6; --muted:#a49e93; --faint:#7c766c;
  --border:#322e26; --border-strong:#413c32;
  --accent:#d7985b; --accent-ink:#e9b27d; --accent-weak:rgba(215,152,91,.15);
  --good:#58b981; --good-weak:rgba(88,185,129,.16);
  --warn:#e0ad4e; --warn-weak:rgba(224,173,78,.16);
  --bad:#e07a6b; --bad-weak:rgba(224,122,107,.15);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 14px 46px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:14.5px;line-height:1.5}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:1rem}
.tnum{font-variant-numeric:tabular-nums}
.oswald{font-family:"Oswald",system-ui,sans-serif}

/* ---- App shell ---- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.sidebar{background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.brand{display:flex;align-items:center;gap:11px;padding:20px 20px 16px}
.brand .logo{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),var(--accent-ink));color:#fff;
  font-family:"Oswald";font-weight:700;font-size:20px;box-shadow:var(--shadow)}
.brand .name{font-family:"Oswald";font-weight:600;font-size:19px;letter-spacing:.3px;line-height:1.05}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 12px;overflow-y:auto;flex:1}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;
  color:var(--muted);padding:10px 12px;border-radius:var(--r-sm);font-size:14.5px;font-weight:500;text-align:left}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:var(--surface-3);color:var(--fg)}
.nav button.active{background:var(--accent-weak);color:var(--accent-ink);font-weight:600}
.nav .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:600;
  min-width:19px;height:19px;padding:0 5px;border-radius:9px;display:grid;place-items:center}
.side-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.side-foot .salon{font-size:12.5px;color:var(--muted);line-height:1.3;min-width:0}
.side-foot .salon b{color:var(--fg);display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.content{padding:26px max(26px,env(safe-area-inset-right,0)) 60px max(26px,env(safe-area-inset-left,0));
  max-width:1180px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head .h{font-family:"Oswald";font-weight:600;font-size:27px;letter-spacing:.3px;line-height:1.05}
.page-head .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.icon-btn{border:1px solid var(--border);background:var(--surface);color:var(--fg);width:38px;height:38px;
  border-radius:10px;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-3)}
.icon-btn svg{width:18px;height:18px}

/* ---- Buttons ---- */
.btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);
  padding:9px 15px;border-radius:10px;font-size:14px;font-weight:600;display:inline-flex;
  align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--border)}
.btn.danger:hover{background:var(--bad-weak)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-3);color:var(--fg)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.block{width:100%;justify-content:center}

/* ---- Cards & KPIs ---- */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(172px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow)}
.kpi .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.kpi .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-weak);color:var(--accent-ink)}
.kpi .ic svg{width:16px;height:16px}
.kpi .val{font-family:"Oswald";font-weight:600;font-size:28px;margin-top:9px;letter-spacing:.3px;line-height:1}
.kpi .val small{font-size:14px;color:var(--muted);font-weight:500;font-family:"DM Sans"}
.kpi .delta{font-size:12.5px;margin-top:6px;color:var(--muted)}
.kpi .delta b{font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.card .card-h h3{font-family:"Oswald";font-weight:600;font-size:17px;letter-spacing:.3px}
.card .card-h .mut{font-size:12.5px;color:var(--muted);font-weight:400;font-family:"DM Sans"}
.card .card-b{padding:16px 18px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
.chart-wrap{position:relative;height:260px}
.chart-wrap.sm{height:230px}

/* ---- Tables ---- */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .r{text-align:right}
.tcard{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.tcard .scroll{overflow-x:auto}

.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-weak);color:var(--accent-ink);
  display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;font-family:"Oswald"}
.cell-name{display:flex;align-items:center;gap:11px;min-width:0}
.cell-name .meta{min-width:0}
.cell-name .meta b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-name .meta span{font-size:12px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill-good{background:var(--good-weak);color:var(--good)}
.pill-warn{background:var(--warn-weak);color:var(--warn)}
.pill-bad{background:var(--bad-weak);color:var(--bad)}
.pill-accent{background:var(--accent-weak);color:var(--accent-ink)}
.pill-mut{background:var(--surface-3);color:var(--muted)}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:180px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
.search input{width:100%;padding:10px 12px 10px 37px;border:1px solid var(--border-strong);border-radius:10px;
  background:var(--surface);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600}
.seg button.active{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* ---- Forms / modal ---- */
.overlay{position:fixed;inset:0;background:rgba(20,16,8,.5);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);
  width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-h h3{font-family:"Oswald";font-weight:600;font-size:19px;letter-spacing:.3px}
.modal-b{padding:20px;overflow-y:auto}
.modal-f{padding:15px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;background:var(--surface-2)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border-strong);
  border-radius:10px;background:var(--surface-2);color:var(--fg)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-weak);border-color:var(--accent);background:var(--surface)}
.field textarea{resize:vertical;min-height:62px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}

/* ---- Empty & misc ---- */
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty svg{width:42px;height:42px;opacity:.5;margin-bottom:12px}
.empty h4{font-family:"Oswald";font-weight:600;font-size:18px;color:var(--fg);margin-bottom:5px}
.sectionlbl{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);font-weight:600;margin:4px 0 2px}

/* Caisse */
.poscols{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.svc-btn{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:13px;text-align:left;transition:transform .05s}
.svc-btn:hover{border-color:var(--accent);background:var(--surface-2)}
.svc-btn:active{transform:scale(.98)}
.svc-btn .n{font-weight:600;font-size:14px}
.svc-btn .p{font-family:"Oswald";color:var(--accent-ink);font-weight:600;margin-top:5px;font-size:16px}
.svc-btn .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.ticket{position:sticky;top:16px}
.ticket .line{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--border)}
.ticket .line .nm{flex:1;min-width:0;font-size:13.5px}
.ticket .line .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{display:inline-flex;align-items:center;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--surface-3);width:24px;height:24px;color:var(--fg);font-weight:700;display:grid;place-items:center}
.qty span{min-width:26px;text-align:center;font-weight:600;font-size:13px}
.ticket .tot{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 4px}
.ticket .tot .v{font-family:"Oswald";font-weight:600;font-size:30px;color:var(--accent-ink)}

.listrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.listrow:last-child{border-bottom:0}

/* Mobile */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:auto 0 0 0;height:auto;z-index:40;flex-direction:row;
    border-right:0;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0)}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;padding:6px 4px;gap:0;justify-content:space-around;width:100%;overflow-x:auto}
  .nav button{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 4px;flex:1;min-width:58px;border-radius:9px;text-align:center;font-weight:600}
  .nav button span.lbl{white-space:nowrap}
  .nav .badge{position:absolute;margin:0;top:3px;right:50%;transform:translateX(16px)}
  .nav button{position:relative}
  .topbar{display:flex;align-items:center;gap:11px;padding:14px max(16px,env(safe-area-inset-left,0));
    position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);z-index:20;
    padding-top:max(14px,env(safe-area-inset-top,0))}
  .topbar .logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--accent),var(--accent-ink));color:#fff;font-family:"Oswald";font-weight:700}
  .topbar .name{font-family:"Oswald";font-weight:600;font-size:17px;flex:1}
  .content{padding:18px max(16px,env(safe-area-inset-right,0)) 92px max(16px,env(safe-area-inset-left,0))}
  .two,.poscols{grid-template-columns:1fr}
  .ticket{position:static}
  .page-head .h{font-size:23px}
  .row2{grid-template-columns:1fr}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <div class="name" id="brandName">Salon Pro</div>
        <div class="sub">Gestion salon</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="salon">
        <b id="footName">Salon Pro</b>
        <span id="footMeta">Données locales</span>
      </div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="logo">S</div>
      <div class="name" id="brandNameM">Salon Pro</div>
      <button class="icon-btn" id="installBtn" hidden title="Installer l'application" onclick="triggerInstall()"></button>
      <button class="icon-btn" id="themeM" title="Thème"></button>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="modalRoot"></div>

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw);return Object.assign({},DEFAULT,d);}
  }catch(e){}
  const seeded=seed(); try{localStorage.setItem(KEY,JSON.stringify(seeded));}catch(e){} return seeded;
}

/* ---------- Données de démonstration ---------- */
function seed(){
  const d=JSON.parse(JSON.stringify(DEFAULT));
  const S=[
    ['Coupe homme',800,30,'Coupe'],['Coupe + barbe',1200,45,'Coupe'],['Dégradé',1000,40,'Coupe'],
    ['Taille de barbe',500,20,'Barbe'],['Rasage traditionnel',700,30,'Barbe'],
    ['Coupe enfant',600,25,'Coupe'],['Coloration',2500,90,'Soin'],['Shampoing + coiffage',900,30,'Soin'],
  ];
  d.services=S.map(s=>({id:uid(),nom:s[0],prix:s[1],duree:s[2],categorie:s[3]}));
  const svc=d.services;
  const C=[['Karim Benali','0661 23 45 67'],['Yacine Hadj','0770 11 22 33'],['Sofiane Meziane','0555 98 76 54'],
    ['Amine Cherif','0661 44 55 66'],['Nabil Saidi','0770 33 44 55'],['Riad Belkacem','0540 12 34 56'],
    ['Walid Ouali','0661 77 88 99'],['Toufik Brahimi','0555 10 20 30']];
  const now=new Date();
  d.clients=C.map((c,i)=>({id:uid(),nom:c[0],tel:c[1],email:'',notes:i===0?'Préfère dégradé bas, ciseaux':'',
    dateAjout:iso(addDays(now,-(40-i*3)))}));
  const cl=d.clients;
  const modes=['Espèces','Espèces','Espèces','Carte'];
  // Ventes réparties sur 40 jours
  for(let day=40;day>=0;day--){
    const date=addDays(now,-day);
    const n=day<2?rnd(3,6):rnd(1,5);
    for(let k=0;k<n;k++){
      const items=[];
      const main=svc[rnd(0,2)]; items.push(line(main));
      if(Math.random()<0.4) items.push(line(svc[rnd(3,4)]));
      if(Math.random()<0.15) items.push(line(svc[rnd(6,7)]));
      const total=items.reduce((s,it)=>s+it.prix*it.qte,0);
      d.ventes.push({id:uid(),clientId:Math.random()<0.75?cl[rnd(0,cl.length-1)].id:null,
        date:iso(date),items,total,mode:modes[rnd(0,3)],note:''});
    }
  }
  // Dépenses
  const dep=[['Loyer local',35000,'Loyer'],['Produits (gel, cire, lames)',12000,'Produits'],
    ['Électricité',6500,'Charges'],['Eau',1800,'Charges'],['Serviettes & consommables',4200,'Produits'],
    ['Publicité réseaux',3000,'Marketing']];
  for(let m=1;m>=0;m--){
    dep.forEach((x,i)=>{
      d.depenses.push({id:uid(),date:iso(new Date(now.getFullYear(),now.getMonth()-m,Math.min(5+i*3,27))),
        categorie:x[2],libelle:x[1],montant:x[1]});
    });
  }
  d.depenses.forEach(x=>{x.libelle=dep.find(z=>z[1]===x.libelle)?.[0]||x.libelle;});
  // corriger: montant/libelle
  d.depenses=[];
  for(let m=1;m>=0;m--){
    dep.forEach((x)=>{d.depenses.push({id:uid(),
      date:iso(new Date(now.getFullYear(),now.getMonth()-m,rnd(3,26))),
      categorie:x[2],libelle:x[0],montant:x[1]});});
  }
  // Rendez-vous à venir
  for(let i=0;i<6;i++){
    const date=addDays(now,rnd(0,5));
    const s=svc[rnd(0,5)];
    d.rdv.push({id:uid(),clientId:cl[rnd(0,cl.length-1)].id,date:iso(date),
      heure:['09:30','10:15','11:00','14:00','15:30','16:45','17:30'][rnd(0,6)],
      serviceIds:[s.id],statut:i<2?'confirmé':'planifié',note:''});
  }
  function line(s){return{serviceId:s.id,nom:s.nom,prix:s.prix,qte:1};}
  return d;
}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function iso(d){return new Date(d).toISOString().slice(0,10);}

/* ============================ Helpers ============================ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(n){const v=Math.round(Number(n)||0);
  return v.toLocaleString('fr-FR').replace(/ |\s/g,' ')+' '+DB.salon.devise;}
function moneyShort(n){n=Number(n)||0;
  if(Math.abs(n)>=1000) return (n/1000).toLocaleString('fr-FR',{maximumFractionDigits:1})+'k';
  return String(Math.round(n));}
function initials(name){return String(name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MOISL=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const JOURS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
function fmtD(isoStr){const d=new Date(isoStr+'T00:00');return `${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}`;}
function fmtDShort(isoStr){const d=new Date(isoStr+'T00:00');return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`;}
const todayISO=()=>iso(new Date());
function monthKey(isoStr){return isoStr.slice(0,7);}
function clientName(id){const c=DB.clients.find(c=>c.id===id);return c?c.nom:'Client de passage';}

/* ---- agrégations ---- */
function revenueOn(isoStr){return DB.ventes.filter(v=>v.date===isoStr).reduce((s,v)=>s+v.total,0);}
function revenueInMonth(mk){return DB.ventes.filter(v=>monthKey(v.date)===mk).reduce((s,v)=>s+v.total,0);}
function expenseInMonth(mk){return DB.depenses.filter(d=>monthKey(d.date)===mk).reduce((s,d)=>s+Number(d.montant),0);}
function clientSpend(id){return DB.ventes.filter(v=>v.clientId===id).reduce((s,v)=>s+v.total,0);}
function clientVisits(id){return DB.ventes.filter(v=>v.clientId===id).length;}
function clientLast(id){const ds=DB.ventes.filter(v=>v.clientId===id).map(v=>v.date).sort();return ds.length?ds[ds.length-1]:null;}

/* -------- TABLEAU DE BORD -------- */
function renderDash(){
  const t=todayISO(); const mk=monthKey(t);
  const prevMk=monthKey(iso(new Date(new Date().getFullYear(),new Date().getMonth()-1,15)));
  const revToday=revenueOn(t);
  const revMonth=revenueInMonth(mk);
  const revPrev=revenueInMonth(prevMk);
  const expMonth=expenseInMonth(mk);
  const profit=revMonth-expMonth;
  const ventesMonth=DB.ventes.filter(v=>monthKey(v.date)===mk);
  const panier=ventesMonth.length?Math.round(revMonth/ventesMonth.length):0;
  const rdvToday=DB.rdv.filter(r=>r.date===t&&r.statut!=='annulé');
  const monthDelta=revPrev?Math.round((revMonth-revPrev)/revPrev*100):0;

  // fidélité
  const actifs=DB.clients.filter(c=>clientVisits(c.id)>0);
  const fideles=actifs.filter(c=>clientVisits(c.id)>1).length;
  const tauxFid=actifs.length?Math.round(fideles/actifs.length*100):0;

  const kpi=(lab,val,ic,delta='')=>`<div class="kpi"><div class="top"><div class="lab">${lab}</div>
    <div class="ic">${svg(ic)}</div></div><div class="val">${val}</div>${delta}</div>`;

  const view=$('#view');
  view.innerHTML=head(`Bonjour 👋`,`${capFirst(fmtDFull(t))} — voici l'activité du salon`,
    `<button class="btn primary" id="newSale">${svg(I.plus)}Nouvelle vente</button>`)+
  `<div class="grid kpis" style="margin-bottom:16px">
    ${kpi("Revenu aujourd'hui",money(revToday),I.cash,`<div class="delta">${rdvToday.length} rendez-vous prévus</div>`)}
    ${kpi("Revenu ce mois",money(revMonth),I.chart,
      `<div class="delta ${monthDelta>=0?'up':'down'}">${monthDelta>=0?'▲':'▼'} <b>${Math.abs(monthDelta)}%</b> vs mois dernier</div>`)}
    ${kpi("Bénéfice net (mois)",money(profit),I.wallet,
      `<div class="delta">Charges : ${money(expMonth)}</div>`)}
    ${kpi("Panier moyen",money(panier),I.receipt,`<div class="delta">${ventesMonth.length} prestations ce mois</div>`)}
    ${kpi("Clients fidèles",tauxFid+'%',I.star,`<div class="delta">${fideles}/${actifs.length} reviennent</div>`)}
    ${kpi("Base clients",String(DB.clients.length),I.users,`<div class="delta">${actifs.length} actifs</div>`)}
  </div>
  <div class="two" style="margin-bottom:16px">
    <div class="card"><div class="card-h"><h3>Revenu — 14 derniers jours</h3>
      <span class="mut">Total ${money(last14Total())}</span></div>
      <div class="card-b"><div class="chart-wrap"><canvas id="cRev"></canvas></div></div></div>
    <div class="card"><div class="card-h"><h3>Prestations populaires</h3></div>
      <div class="card-b"><div class="chart-wrap sm"><canvas id="cSvc"></canvas></div></div></div>
  </div>
  <div class="two">
    <div class="card"><div class="card-h"><h3>Meilleurs clients</h3><span class="mut">Par dépense totale</span></div>
      <div class="card-b" style="padding-top:4px">${topClientsHTML()}</div></div>
    <div class="card"><div class="card-h"><h3>Rendez-vous aujourd'hui</h3>
      <button class="btn sm" id="goRdv">Voir l'agenda</button></div>
      <div class="card-b" style="padding-top:4px">${todayRdvHTML(rdvToday)}</div></div>
  </div>`;
  wireHead();
  $('#newSale').onclick=()=>go('caisse');
  $('#goRdv').onclick=()=>go('rdv');
  view.querySelectorAll('[data-client]').forEach(el=>el.onclick=()=>openClient(el.dataset.client));
  drawRevChart(); drawSvcChart();
}
function capFirst(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function fmtDFull(isoStr){const d=new Date(isoStr+'T00:00');
  const j=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'][d.getDay()];
  return `${j} ${d.getDate()} ${MOISL[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;}
function last14(){const arr=[];for(let i=13;i>=0;i--){const d=iso(addDays(new Date(),-i));arr.push([d,revenueOn(d)]);}return arr;}
function last14Total(){return last14().reduce((s,x)=>s+x[1],0);}

function topClientsHTML(){
  const rows=DB.clients.map(c=>({c,spend:clientSpend(c.id),v:clientVisits(c.id)}))
    .filter(r=>r.spend>0).sort((a,b)=>b.spend-a.spend).slice(0,5);
  if(!rows.length) return emptyMini('Aucune vente enregistrée');
  return rows.map(r=>`<div class="listrow" data-client="${r.c.id}" style="cursor:pointer">
    <div class="avatar">${initials(r.c.nom)}</div>
    <div style="flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.c.nom)}</b>
      <span style="font-size:12.5px;color:var(--muted)">${r.v} visite${r.v>1?'s':''}</span></div>
    <div class="oswald" style="font-weight:600;color:var(--accent-ink)">${money(r.spend)}</div></div>`).join('');
}
function todayRdvHTML(list){
  if(!list.length) return emptyMini('Aucun rendez-vous aujourd\'hui');
  return list.sort((a,b)=>a.heure.localeCompare(b.heure)).map(r=>{
    const svcNames=r.serviceIds.map(id=>DB.services.find(s=>s.id===id)?.nom).filter(Boolean).join(', ');
    return `<div class="listrow">
      <div class="pill pill-accent oswald" style="font-size:14px">${r.heure}</div>
      <div style="flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(clientName(r.clientId))}</b>
      <span style="font-size:12.5px;color:var(--muted)">${esc(svcNames||'—')}</span></div>
      ${statutPill(r.statut)}</div>`;}).join('');
}
function emptyMini(t){return `<div style="text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px">${t}</div>`;}
function statutPill(s){const m={'planifié':'pill-mut','confirmé':'pill-accent','terminé':'pill-good','annulé':'pill-bad'};
  return `<span class="pill ${m[s]||'pill-mut'}">${s}</span>`;}

/* ----- charts ----- */
function chartColors(){
  const cs=getComputedStyle(document.documentElement);
  return {grid:cs.getPropertyValue('--border').trim(),text:cs.getPropertyValue('--muted').trim(),
    accent:cs.getPropertyValue('--accent').trim(),ink:cs.getPropertyValue('--fg').trim()};}
function drawRevChart(){
  const c=chartColors(),data=last14();
  const ctx=$('#cRev');if(!ctx)return;
  const grad=ctx.getContext('2d').createLinearGradient(0,0,0,240);
  grad.addColorStop(0,hexA(c.accent,.35));grad.addColorStop(1,hexA(c.accent,0));
  chartRefs.push(new Chart(ctx,{type:'line',data:{labels:data.map(d=>{const dt=new Date(d[0]+'T00:00');return dt.getDate()+'/'+(dt.getMonth()+1);}),
    datasets:[{data:data.map(d=>d[1]),borderColor:c.accent,backgroundColor:grad,fill:true,tension:.35,
      borderWidth:2.5,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:c.accent}]},
    options:baseOpts(c,v=>money(v))}));
}
function drawSvcChart(){
  const c=chartColors();const ctx=$('#cSvc');if(!ctx)return;
  const tally={};DB.ventes.forEach(v=>v.items.forEach(it=>{tally[it.nom]=(tally[it.nom]||0)+it.qte;}));
  const ent=Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(!ent.length){ctx.parentElement.innerHTML=emptyMini('Aucune donnée');return;}
  const pal=palette(c.accent,ent.length);
  chartRefs.push(new Chart(ctx,{type:'doughnut',data:{labels:ent.map(e=>e[0]),
    datasets:[{data:ent.map(e=>e[1]),backgroundColor:pal,borderWidth:2,
      borderColor:getComputedStyle(document.documentElement).getPropertyValue('--surface').trim()}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',
      plugins:{legend:{position:'right',labels:{color:c.text,boxWidth:10,boxHeight:10,padding:9,font:{family:'DM Sans',size:12}}},
        tooltip:tt(c,v=>v+' prestations')}}}));
}
function baseOpts(c,fmt){return{responsive:true,maintainAspectRatio:false,
  plugins:{legend:{display:false},tooltip:tt(c,fmt)},
  scales:{x:{grid:{display:false},border:{display:false},ticks:{color:c.text,font:{family:'DM Sans',size:11},maxRotation:0,autoSkip:true,maxTicksLimit:8}},
    y:{grid:{color:c.grid},border:{display:false},ticks:{color:c.text,font:{family:'DM Sans',size:11},
      callback:v=>moneyShort(v)},beginAtZero:true}}};}
function tt(c,fmt){return{backgroundColor:c.ink,titleColor:hexA('#ffffff',.9),bodyColor:'#fff',
  padding:10,cornerRadius:8,displayColors:false,titleFont:{family:'DM Sans',size:12},bodyFont:{family:'Oswald',size:14},
  callbacks:{label:ctx=>fmt?fmt(ctx.parsed.y??ctx.parsed):ctx.formattedValue}};}
function hexA(hex,a){hex=hex.trim();if(hex.startsWith('rgb'))return hex;
  if(hex.length===4)hex='#'+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3];
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;}
function palette(base,n){const out=[];for(let i=0;i<n;i++){out.push(hexA(base,1-(i*0.13)));}return out;}

/* -------- RAPPELS (SMS / WhatsApp / email) -------- */
function fillTmpl(t,map){return String(t||'').replace(/\{(\w+)\}/g,(m,k)=>map[k]!=null?map[k]:m);}
function telIntl(tel){let s=String(tel||'').replace(/[^\d+]/g,'');
  if(s.startsWith('+'))return s.slice(1);
  if(s.startsWith('00'))return s.slice(2);
  if(s.startsWith('0'))return '213'+s.slice(1);
  if(s.startsWith('213'))return s;
  return s?'213'+s:'';}
function rappelMessage(r){
  const c=DB.clients.find(x=>x.id===r.clientId);
  const tmpl=DB.salon.rappelMsg||'Bonjour {client}, rappel de votre rendez-vous {date} à {heure} chez {salon}.';
  return fillTmpl(tmpl,{client:c?c.nom.split(' ')[0]:'',salon:DB.salon.nom,date:fmtDShort(r.date),heure:r.heure});
}
function markReminded(r,canal,dest){
  r.rappelEnvoye=true;r.rappelCanal=canal;r.rappelAt=new Date().toISOString();
  (DB.rappels=DB.rappels||[]).unshift({id:uid(),rdvId:r.id,clientNom:clientName(r.clientId),
    canal,dest,date:new Date().toISOString(),rdvDate:r.date,rdvHeure:r.heure});
  if(DB.rappels.length>300)DB.rappels.length=300;
  save();buildNav();
}
function remindSheet(id){
  const r=DB.rdv.find(x=>x.id===id);if(!r)return;
  const c=DB.clients.find(x=>x.id===r.clientId);
  const msg=rappelMessage(r);
  openModal('Rappeler '+(c?esc(c.nom):''),`
    <div class="field"><label>Message</label>
      <textarea id="rm_msg" style="min-height:96px">${esc(msg)}</textarea>
      <div class="hint">Choisissez un canal : l'application s'ouvre avec le message déjà rempli, vous n'avez plus qu'à appuyer sur Envoyer.</div></div>
    <div style="display:flex;flex-direction:column;gap:9px;margin-top:4px">
      ${c&&c.tel?`<button class="btn block rem-ch" data-ch="whatsapp" style="justify-content:center">${svg(I.whatsapp)}WhatsApp</button>`:''}
      ${c&&c.tel?`<button class="btn block rem-ch" data-ch="sms" style="justify-content:center">${svg(I.sms)}SMS</button>`:''}
      ${c&&c.email?`<button class="btn block rem-ch" data-ch="email" style="justify-content:center">${svg(I.mail)}Email</button>`:''}
      ${c&&!c.tel&&!c.email?`<div class="empty-mini">Ce client n'a ni numéro ni email. Ajoutez-en un dans sa fiche pour pouvoir le rappeler.</div>`:''}
    </div>`,null,[]);
  const root=$('#modalRoot');
  root.querySelectorAll('.rem-ch').forEach(b=>b.onclick=()=>{
    const ch=b.dataset.ch;const text=($('#rm_msg').value||msg);
    let url,dest;
    if(ch==='whatsapp'){dest=c.tel;url='https://wa.me/'+telIntl(c.tel)+'?text='+encodeURIComponent(text);}
    else if(ch==='sms'){dest=c.tel;url='sms:+'+telIntl(c.tel)+'?body='+encodeURIComponent(text);}
    else {dest=c.email;url='mailto:'+encodeURIComponent(c.email)+'?subject='+encodeURIComponent('Rappel rendez-vous — '+DB.salon.nom)+'&body='+encodeURIComponent(text);}
    if(ch==='whatsapp')window.open(url,'_blank');else window.location.href=url;
    markReminded(r,ch,dest);
    closeModal();renderRdv();
    toast('Rappel ouvert dans '+(ch==='whatsapp'?'WhatsApp':ch==='sms'?'Messages':'votre messagerie'));
  });
}

        ${cart.length?`<button class="btn ghost sm" id="clearCart">Vider</button>`:''}</div>
        <div class="card-b" id="ticketBody"></div></div>
    </div>`;
  wireHead();
  $('#view').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{caisseAdd(b.dataset.add);});
  renderTicket();
  const cc=$('#clearCart');if(cc)cc.onclick=()=>{cart=[];renderCaisse();};
}
function caisseAdd(sid){
  const s=DB.services.find(x=>x.id===sid);if(!s)return;
  const ex=cart.find(l=>l.serviceId===sid);
  if(ex)ex.qte++;else cart.push({serviceId:sid,nom:s.nom,prix:s.prix,qte:1});
  renderTicket();
}
function caisseSetClient(id){cartClient=id;const sel=$('#f_posClient');if(sel)sel.value=id;}
function renderTicket(){
  const body=$('#ticketBody');if(!body)return;
  const total=cart.reduce((s,l)=>s+l.prix*l.qte,0);
  const clientOpts=DB.clients.map(c=>`<option value="${c.id}" ${cartClient===c.id?'selected':''}>${esc(c.nom)}</option>`).join('');
  body.innerHTML=`
    <div class="field" style="margin-bottom:12px"><label>Client</label>
      <select id="f_posClient"><option value="">Client de passage</option>${clientOpts}</select></div>
    ${cart.length?cart.map((l,i)=>`<div class="line">
      <div class="nm"><b>${esc(l.nom)}</b><span style="color:var(--muted);font-size:12px">${money(l.prix)}</span></div>
      <div class="qty"><button data-dec="${i}">−</button><span>${l.qte}</span><button data-inc="${i}">+</button></div>
      <div class="oswald" style="font-weight:600;min-width:64px;text-align:right">${money(l.prix*l.qte)}</div>
    </div>`).join(''):`<div style="text-align:center;color:var(--muted);padding:24px 6px;font-size:13.5px">Cliquez sur une prestation pour l'ajouter</div>`}
    <div class="tot"><span style="color:var(--muted);font-weight:600">TOTAL</span><span class="v">${money(total)}</span></div>
    <div class="field" style="margin:12px 0"><label>Mode de paiement</label>
      <select id="f_mode"><option>Espèces</option><option>Carte</option><option>Virement</option><option>Crédit</option></select></div>
    <button class="btn primary block" id="validate" ${!cart.length?'disabled style="opacity:.5"':''}>${svg(I.check)}Encaisser ${money(total)}</button>`;
  $('#f_posClient').onchange=e=>cartClient=e.target.value;
  body.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{cart[b.dataset.inc].qte++;renderTicket();});
  body.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const i=b.dataset.dec;
    if(cart[i].qte>1)cart[i].qte--;else cart.splice(i,1);renderTicket();});
  const v=$('#validate');if(v&&cart.length)v.onclick=validateSale;
}
function validateSale(){
  if(!cart.length)return;
  const total=cart.reduce((s,l)=>s+l.prix*l.qte,0);
  const vente={id:uid(),clientId:cartClient||null,date:todayISO(),
    items:cart.map(l=>({...l})),total,mode:$('#f_mode').value,note:''};
  DB.ventes.push(vente);save();
  const vt=vente;cart=[];cartClient='';
  renderCaisse();
  showReceipt(vt);
  toast('Vente encaissée ✓');
}
function showReceipt(v){
  const lines=v.items.map(it=>`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px">

        ${fmtDFull(v.date)} · ${esc(clientName(v.clientId))}</div>${lines}</div>
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <b style="font-size:15px">TOTAL</b><b class="oswald" style="font-size:26px;color:var(--accent-ink)">${money(v.total)}</b></div>

function renderFin(){
  const mk=monthKey(todayISO());
  const rev=revenueInMonth(mk),exp=expenseInMonth(mk),profit=rev-exp;
  const marge=rev?Math.round(profit/rev*100):0;
  const kpi=(l,v,sub,cls='')=>`<div class="kpi"><div class="lab">${l}</div><div class="val ${cls}" style="font-size:25px">${v}</div>
    <div class="delta">${sub}</div></div>`;
  $('#view').innerHTML=head('Finances',`Suivi des revenus, charges et bénéfices`,
    `<button class="btn primary" id="addDep">${svg(I.plus)}Nouvelle charge</button>`)+
    `<div class="grid kpis" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:16px">
      ${kpi('Revenus (mois)',money(rev),MOISL[new Date().getMonth()])}
      ${kpi('Charges (mois)',money(exp),DB.depenses.filter(d=>monthKey(d.date)===mk).length+' dépenses')}
      ${kpi('Bénéfice net',money(profit),'Revenus − charges',profit>=0?'up':'down')}
      ${kpi('Marge nette',marge+'%',profit>=0?'Rentable':'En perte',profit>=0?'up':'down')}
    </div>
    <div class="two" style="margin-bottom:16px">
      <div class="card"><div class="card-h"><h3>Revenus vs charges</h3><span class="mut">6 derniers mois</span></div>
        <div class="card-b"><div class="chart-wrap"><canvas id="cFin"></canvas></div></div></div>
      <div class="card"><div class="card-h"><h3>Répartition des charges</h3></div>
        <div class="card-b"><div class="chart-wrap sm"><canvas id="cDep"></canvas></div></div></div>
    </div>
    <div class="card"><div class="card-h"><h3>Charges & dépenses</h3></div>
      <div class="scroll"><table class="tbl"><thead><tr><th>Libellé</th><th class="hide-sm">Catégorie</th>
        <th class="r">Date</th><th class="r">Montant</th><th></th></tr></thead>
        <tbody>${DB.depenses.length?DB.depenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(depRow).join('')
          :`<tr><td colspan="5">${emptyMini('Aucune charge enregistrée')}</td></tr>`}</tbody></table></div></div>`;
  wireHead();
  $('#addDep').onclick=()=>depForm();
  $('#view').querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>depForm(el.dataset.edit));
  drawFinChart();drawDepChart();
}
function depRow(d){
  return `<tr><td><b>${esc(d.libelle)}</b></td><td class="hide-sm"><span class="pill pill-mut">${esc(d.categorie)}</span></td>
    <td class="r" style="color:var(--muted)">${fmtD(d.date)}</td>
    <td class="r tnum" style="font-weight:600;color:var(--bad)">− ${money(d.montant)}</td>
    <td class="r"><button class="icon-btn" data-edit="${d.id}" style="width:32px;height:32px">${svg(I.edit)}</button></td></tr>`;
}
function depForm(id){
  const d=id?DB.depenses.find(x=>x.id===id):null;
  const cats=['Loyer','Produits','Charges','Salaires','Matériel','Marketing','Taxes','Autres'];
  openModal(d?'Modifier la charge':'Nouvelle charge',`
    <div class="field"><label>Libellé *</label><input id="f_lib" value="${esc(d?.libelle||'')}" placeholder="Ex : Loyer du local"></div>
    <div class="row2">
      <div class="field"><label>Montant (${DB.salon.devise}) *</label><input type="number" id="f_mont" value="${d?.montant??''}" min="0"></div>
      <div class="field"><label>Date</label><input type="date" id="f_date" value="${d?.date||todayISO()}"></div></div>
    <div class="field"><label>Catégorie</label><select id="f_cat">${cats.map(c=>`<option ${d?.categorie===c?'selected':''}>${c}</option>`).join('')}</select></div>`,
    ()=>{
      const lib=$('#f_lib').value.trim(),mont=Number($('#f_mont').value);
      if(!lib||!mont){if(!lib)$('#f_lib').focus();return false;}
      const data={libelle:lib,montant:mont,date:$('#f_date').value,categorie:$('#f_cat').value};
      if(d)Object.assign(d,data);else DB.depenses.push({id:uid(),...data});
      save();renderFin();toast(d?'Charge modifiée':'Charge ajoutée');
    },d?[{label:'Supprimer',cls:'danger',act:()=>{DB.depenses=DB.depenses.filter(x=>x.id!==id);save();closeModal();renderFin();toast('Charge supprimée');}}]:[]);
}
function last6Months(){const arr=[];const now=new Date();
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const mk=iso(d).slice(0,7);arr.push({mk,label:MOIS[d.getMonth()],rev:revenueInMonth(mk),exp:expenseInMonth(mk)});}
  return arr;}
function drawFinChart(){
  const c=chartColors();const ctx=$('#cFin');if(!ctx)return;const data=last6Months();
  const cs=getComputedStyle(document.documentElement);
  chartRefs.push(new Chart(ctx,{type:'bar',data:{labels:data.map(d=>d.label),datasets:[
    {label:'Revenus',data:data.map(d=>d.rev),backgroundColor:c.accent,borderRadius:6,maxBarThickness:26},
    {label:'Charges',data:data.map(d=>d.exp),backgroundColor:cs.getPropertyValue('--bad').trim(),borderRadius:6,maxBarThickness:26}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',align:'end',labels:{color:c.text,boxWidth:11,boxHeight:11,padding:12,font:{family:'DM Sans',size:12}}},
        tooltip:tt(c,v=>money(v))},
      scales:{x:{grid:{display:false},border:{display:false},ticks:{color:c.text,font:{family:'DM Sans',size:11}}},
        y:{grid:{color:c.grid},border:{display:false},beginAtZero:true,ticks:{color:c.text,font:{family:'DM Sans',size:11},callback:v=>moneyShort(v)}}}}}));
}
function drawDepChart(){
  const c=chartColors();const ctx=$('#cDep');if(!ctx)return;
  const tally={};DB.depenses.forEach(d=>{tally[d.categorie]=(tally[d.categorie]||0)+Number(d.montant);});
  const ent=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  if(!ent.length){ctx.parentElement.innerHTML=emptyMini('Aucune charge');return;}
  const cs=getComputedStyle(document.documentElement);
  chartRefs.push(new Chart(ctx,{type:'doughnut',data:{labels:ent.map(e=>e[0]),
    datasets:[{data:ent.map(e=>e[1]),backgroundColor:palette(cs.getPropertyValue('--bad').trim(),ent.length),borderWidth:2,
      borderColor:cs.getPropertyValue('--surface').trim()}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',
      plugins:{legend:{position:'right',labels:{color:c.text,boxWidth:10,boxHeight:10,padding:9,font:{family:'DM Sans',size:12}}},
        tooltip:tt(c,v=>money(v))}}}));
}

/* ============================ Modal & toast ============================ */
let modalSubmit=null;
function openModal(title,bodyHTML,onSubmit,extraBtns=[],cls=''){
  modalSubmit=onSubmit;
  const btns=[];
  extraBtns.forEach(b=>btns.push(`<button class="btn ${b.cls||''}" data-x="${b._i=extraBtns.indexOf(b)}">${esc(b.label)}</button>`));
  const footer=onSubmit
    ? `<button class="btn ghost" data-close>Annuler</button><button class="btn primary" data-submit>${svg(I.check)}Enregistrer</button>`
    : (extraBtns.length?'':`<button class="btn" data-close>Fermer</button>`);
  // place extra buttons (like delete) on the left for forms
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><div class="modal ${cls}">
    <div class="modal-h"><h3>${esc(title)}</h3><button class="icon-btn" data-close style="width:34px;height:34px">${svg(I.x)}</button></div>
    <div class="modal-b">${bodyHTML}</div>
    <div class="modal-f">${extraBtns.length?`<div style="margin-right:auto;display:flex;gap:8px">${btns.join('')}</div>`:''}${footer}</div>
  </div></div>`;
  const ov=$('#ov');
  ov.onclick=e=>{if(e.target===ov)closeModal();};
  $('#modalRoot').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  const sub=$('#modalRoot [data-submit]');if(sub)sub.onclick=doSubmit;
  $('#modalRoot').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{extraBtns[b.dataset.x].act();});
  const first=$('#modalRoot input,#modalRoot select,#modalRoot textarea');if(first&&onSubmit)setTimeout(()=>first.focus(),40);
  document.onkeydown=e=>{if(e.key==='Escape')closeModal();
    if(e.key==='Enter'&&onSubmit&&e.target.tagName!=='TEXTAREA'){doSubmit();}};
}
function doSubmit(){if(modalSubmit){const r=modalSubmit();if(r!==false)closeModal();}}
function closeModal(){$('#modalRoot').innerHTML='';modalSubmit=null;document.onkeydown=null;}
function confirmBox(title,msg,onYes){
  openModal(title,`<p style="color:var(--muted);margin:0;font-size:14px">${esc(msg)}</p>`,null,
    [{label:'Annuler',cls:'ghost',act:closeModal},{label:'Confirmer',cls:'danger',act:onYes}]);
}
let toastT;
function toast(msg){
  let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';
    t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);'+
    'padding:11px 20px;border-radius:12px;font-weight:600;font-size:14px;z-index:99;box-shadow:var(--shadow-lg);'+
    'max-width:90vw;text-align:center;transition:opacity .2s,transform .2s';
    document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(toastT);toastT=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(10px)';},2200);
}

function refreshBrand(){
  $('#brandName').textContent=DB.salon.nom;$('#brandNameM').textContent=DB.salon.nom;
  $('#footName').textContent=DB.salon.nom;
  $('#footMeta').textContent=`${DB.clients.length} clients`;
  $('.brand .logo').textContent=initials(DB.salon.nom).slice(0,1);

}
$('#themeM').onclick=()=>{toggleTheme();render();};
$('#installBtn').innerHTML=svg(I.install);
syncTopTheme();

if(window.matchMedia)matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{
  if(!currentTheme()){syncTopTheme();if(route==='dash')renderDash();if(route==='fin')renderFin();}});
</script>
<script>
/* Enregistrement du service worker (installation + hors-ligne) */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('service-worker.js').catch(()=>{});});
}
/* Invite d'installation "Ajouter à l'écran d'accueil" */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;
  const b=document.getElementById('installBtn');if(b)b.hidden=false;});
function triggerInstall(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;
  const b=document.getElementById('installBtn');if(b)b.hidden=true;}}
window.addEventListener('appinstalled',()=>{const b=document.getElementById('installBtn');if(b)b.hidden=true;});
</script>
