<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#b1702a">
<title>Salon Pro</title>
<meta name="description" content="Application de gestion pour coiffeur : clients, rendez-vous, caisse, finances et rappels. Hors-ligne, données sur votre téléphone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salon Pro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="vendor/chart.umd.min.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button id="logo" class="logo" aria-label="Accueil">S</button>
    <div class="ttl"><h1 id="brand">Salon Pro</h1><p id="subbrand">Gestion de salon</p></div>
    <div class="topbar-actions">
      <button id="btnInstall" class="iconbtn sm" hidden aria-label="Installer l'application"></button>
      <button id="btnSettings" class="iconbtn sm" aria-label="Réglages"></button>
      <button id="btnTheme" class="iconbtn sm" aria-label="Thème"></button>
    </div>
  </header>
  <main id="content" class="content"></main>
  <nav id="nav" class="bottomnav" aria-label="Navigation principale"></nav>
</div>
<div id="sheet-root"></div>
<div id="onb-root"></div>
</body>
</html>
