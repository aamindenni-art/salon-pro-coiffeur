<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Salon Gérant</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css?v=7">
<script src="./config.js?v=7"></script>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <div class="emblem" data-emblem>G</div>
        <div style="min-width:0">
          <div class="nm" data-brand-name>Salon Gérant</div>
          <div class="sub" data-brand-sub>Gestion du salon</div>
        </div>
      </div>
      <nav class="side-nav" id="sideNav" aria-label="Navigation"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="brand">
          <div class="emblem" data-emblem>G</div>
          <div style="min-width:0">
            <div class="nm" data-brand-name>Salon Gérant</div>
            <div class="sub" data-brand-sub>Gestion du salon</div>
          </div>
        </div>
        <div class="top-actions" id="topActions"></div>
      </header>
      <main class="wrap" id="app"></main>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Navigation"></nav>

  <div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="dlg-bg" id="dlgBg" hidden></div>
  <div class="lock" id="lock" hidden></div>
  <div class="upd" id="updBar" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="printArea"></div>

  <script src="./js/lib.js?v=7" defer></script>
  <script src="./js/core.js?v=7" defer></script>
  <script src="./js/sync.js?v=7" defer></script>
  <script src="./js/auth.js?v=7" defer></script>
  <script src="./js/views-caisse.js?v=7" defer></script>
  <script src="./js/views-agenda.js?v=7" defer></script>
  <script src="./js/views-equipe.js?v=7" defer></script>
  <script src="./js/views-gestion.js?v=7" defer></script>
  <script src="./js/views-rapports.js?v=7" defer></script>
  <script src="./js/views-admin.js?v=7" defer></script>
  <script src="./js/views-start.js?v=7" defer></script>
</body>
</html>
